# Fly.io app config for the FastAPI backend.
#
# Deploy from this directory (backend/):
#   fly launch --no-deploy --copy-config --name <your-app-name>   # first time only
#   fly deploy
#
# Secrets (DATABASE_URL, R2_*, ANTHROPIC_API_KEY, SECRET_KEY,
# JWT_SECRET_KEY, ...) are NOT set here — see docs/deployment.md for the
# `fly secrets set` commands. Never commit secrets into this file.
#
# GPU note (Prompt 9): this container still bundles the full STT/TTS/
# lip-sync stack (Whisper, Chatterbox, MuseTalk) from the base project,
# including CUDA-linked torch wheels — but on this standard (non-GPU) Fly
# machine it never actually runs that code. Set GPU_SERVICE_URL (as a
# secret, see docs/deployment.md section 6) to a persistent Runpod pod
# running this SAME image, and every STT/TTS/animate call proxies there
# over HTTP via app/services/gpu_client.py instead of running in-process.
# Leave GPU_SERVICE_URL unset to fall back to slow CPU in-process inference
# (useful for exercising the API/WebSocket/health-check surface without a
# GPU pod running).

app = "life-capsule-backend" # override with your own globally-unique name
primary_region = "iad" # pick the region closest to your Neon/AuraDB instances

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  USE_LOCAL_STORAGE = "false"
  STORAGE_PROVIDER = "r2"
  # This project consolidates on Gemini (GEMINI_API_KEY secret) rather than
  # separately funding Anthropic — see app/services/llm.py.
  LLM_PROVIDER = "gemini"
  LLM_MODEL = "gemini-flash-lite-latest"
  EMBEDDING_PROVIDER = "gemini"
  EMBEDDING_MODEL = "gemini-embedding-001"
  EMBEDDING_DIM = "3072"

[http_service]
  internal_port = 8000
  force_https = true
  # A WebSocket backend shouldn't cold-start mid-conversation, and this
  # image's first-boot model warmup (Whisper/Chatterbox) is slow — keep at
  # least one machine warm rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "120s" # first-boot model loading
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "performance-2x" # 2 vCPU / 4GB — CPU-mode STT/TTS is heavy; bump if /health reports it's struggling
